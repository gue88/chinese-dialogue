<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>汉语对话练习</title>
    <style>
      :root {
        --bg: #14161a;
        --fg: #ece9e4;
        --mute: #8d9099;
        --a: #7fb7c9;
        --b: #e0a37a;
        --card: #1c1f25;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px)
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        line-height: 1.4
      }

      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 16px 80px
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 2;
        background: var(--bg);
        padding: 14px 0 12px;
        border-bottom: 1px solid #262a31;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        justify-content: space-between
      }

      h1 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0
      }

      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap
      }

      button {
        font: inherit;
        font-size: .85rem;
        color: var(--fg);
        background: var(--card);
        border: 1px solid #2c3037;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer
      }

      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px
      }

      button[aria-pressed=true] {
        border-color: var(--fg)
      }

      button.a[aria-pressed=true] {
        border-color: var(--a);
        color: var(--a)
      }

      button.b[aria-pressed=true] {
        border-color: var(--b);
        color: var(--b)
      }

      h2 {
        font-size: .95rem;
        font-weight: 500;
        color: var(--mute);
        margin: 44px 0 14px
      }

      .line {
        display: flex;
        margin: 0 0 14px
      }

      .line.B {
        justify-content: flex-end
      }

      .bubble {
        max-width: 88%;
        padding: 10px 16px 12px;
        border-radius: 14px;
        background: var(--card);
        border-left: 3px solid var(--a)
      }

      .B .bubble {
        border-left: 0;
        border-right: 3px solid var(--b);
        text-align: right
      }

      .who {
        display: block;
        font-size: .75rem;
        color: var(--mute);
        margin-bottom: 2px
      }

      .zh {
        font-size: 2rem;
        line-height: 2.5
      }

      ruby {
        ruby-position: over
      }

      rt {
        font-size: .5em;
        color: #aab0ba;
        letter-spacing: 0;
        font-weight: 400
      }

      .nopy rt {
        display: none
      }

      .nopy .zh {
        line-height: 1.6
      }

      .en {
        display: none;
        font-size: .95rem;
        color: var(--mute);
        line-height: 1.4;
        margin-top: 2px
      }

      .showen .en {
        display: block
      }

      /* English-only mode: hide Chinese/pinyin, force English visible */
      .onlyen .zh {
        display: none
      }

      .onlyen .en {
        display: block
      }

      .fb {
        display: block;
        font-size: .75rem;
        color: #aab0ba;
        line-height: 1.2
      }

      /* Fully hide the other speaker's lines when focused */
      body[data-focus=A] .line.B,
      body[data-focus=B] .line.A {
        display: none
      }

      @media (max-width:480px) {
        .zh {
          font-size: 1.35rem
        }

        .bubble {
          max-width: 94%
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>汉语对话练习</h1>
        <div class="tools">
          <button id="py" aria-pressed="true">拼音</button>
          <button id="en" aria-pressed="false">English</button>
          <button id="enonly" aria-pressed="false">EN only</button>
          <button class="a" data-f="A" aria-pressed="false">我是 A</button>
          <button class="b" data-f="B" aria-pressed="false">我是 B</button>
        </div>
      </header>
      <div id="out"></div>
    </main>
    <script>
      const WHO = { A: "马大为 Mǎ Dàwéi", B: "丁力波 Dīng Lìbō" };
      const DATA = `# 问候
A|丁力波，早上好！|Dīng Lìbō, zǎoshang hǎo!|Dīng Lìbō, good morning!
B|你早！好久不见。|Nǐ zǎo! Hǎojiǔ bú jiàn.|Morning! Long time no see.
A|好久不见。你最近怎么样？|Hǎojiǔ bú jiàn. Nǐ zuìjìn zěnmeyàng?|Long time no see. How have you been lately?
B|我很忙，这个星期我要参加很多活动。你呢？|Wǒ hěn máng, zhège xīngqī wǒ yào cānjiā hěn duō huódòng. Nǐ ne?|I'm very busy — I have lots of events to attend this week. How about you?
A|我不太忙。|Wǒ bú tài máng.|I'm not too busy.
# 学习和工作
B|你学什么专业？|Nǐ xué shénme zhuānyè?|What do you study?
A|我是汉语专业。你的专业也是汉语吗？|Wǒ shì Hànyǔ zhuānyè. Nǐ de zhuānyè yě shì Hànyǔ ma?|I'm a Chinese major. Is your major Chinese too?
B|是，我也是汉语专业。我们都在 RMIT 学习。|Shì, wǒ yě shì Hànyǔ zhuānyè. Wǒmen dōu zài RMIT xuéxí.|Yes, I'm a Chinese major too. We both study at RMIT.
A|你星期几有汉语课？|Nǐ xīngqī jǐ yǒu Hànyǔ kè?|Which days do you have Chinese class?
B|我星期二上午十一点半和星期四中午十二点半有汉语课。|Wǒ xīngqī'èr shàngwǔ shíyī diǎn bàn hé xīngqīsì zhōngwǔ shí'èr diǎn bàn yǒu Hànyǔ kè.|I have Chinese class on Tuesday at 11:30 in the morning and Thursday at 12:30 at noon.
A|我也是。汉语课难不难？有意思吗？|Wǒ yě shì. Hànyǔ kè nán bu nán? Yǒu yìsi ma?|Me too. Is Chinese class hard? Is it interesting?
B|有一点儿难，但是很有意思。我们学五十个汉字。|Yǒu yìdiǎnr nán, dànshì hěn yǒu yìsi. Wǒmen xué wǔshí gè Hànzì.|A little hard, but very interesting. We're learning fifty characters.
A|对，口语特别难。你们班一共有多少人？|Duì, kǒuyǔ tèbié nán. Nǐmen bān yígòng yǒu duōshao rén?|Yes, speaking is especially hard. How many people are in your class altogether?
B|我们班一共有十五个人，男生不多。你工作吗？|Wǒmen bān yígòng yǒu shíwǔ gè rén, nánshēng bù duō. Nǐ gōngzuò ma?|There are fifteen people in our class altogether, and not many boys. Do you work?
A|我晚上在学校工作，不太累。你呢？|Wǒ wǎnshang zài xuéxiào gōngzuò, bú tài lèi. Nǐ ne?|I work at the school in the evenings, so it's not too tiring. How about you?
B|我不工作。咱们一起练习口语，好不好？|Wǒ bù gōngzuò. Zánmen yìqǐ liànxí kǒuyǔ, hǎo bu hǎo?|I don't work. Shall we practise speaking together?
A|好！|Hǎo!|Good!
# 名字和国籍
B|对了，我们班有一个学生，她也学习汉语。|Duìle, wǒmen bān yǒu yí ge xuésheng, tā yě xuéxí Hànyǔ.|By the way, there's a student in our class who also studies Chinese.
A|她叫什么名字？她是哪国人？|Tā jiào shénme míngzi? Tā shì nǎ guó rén?|What's her name? What country is she from?
B|她姓林，叫林娜。她是英国人。|Tā xìng Lín, jiào Lín Nà. Tā shì Yīngguó rén.|Her surname is Lin and she's called Lin Na. She's British.
A|林娜是她的中文名字吗？|Lín Nà shì tā de Zhōngwén míngzi ma?|Is Lin Na her Chinese name?
B|是，陈老师教我们写中文名字。你的中文名字呢？|Shì, Chén lǎoshī jiāo wǒmen xiě Zhōngwén míngzi. Nǐ de Zhōngwén míngzi ne?|Yes, Teacher Chen taught us to write Chinese names. What about your Chinese name?
A|我的中文名字是马大为。我是美国人，你是哪国人？|Wǒ de Zhōngwén míngzi shì Mǎ Dàwéi. Wǒ shì Měiguó rén, nǐ shì nǎ guó rén?|My Chinese name is Ma Dawei. I'm American. What country are you from?
B|我是越南人，我妈妈是四川人。我常常去越南。|Wǒ shì Yuènán rén, wǒ māma shì Sìchuān rén. Wǒ chángcháng qù Yuènán.|I'm Vietnamese, and my mother is from Sichuan. I often go to Vietnam.
A|你去四川吗？|Nǐ qù Sìchuān ma?|Do you go to Sichuan?
B|我去四川，也去北京。四川和北京都很好。|Wǒ qù Sìchuān, yě qù Běijīng. Sìchuān hé Běijīng dōu hěn hǎo.|I go to Sichuan, and to Beijing too. Sichuan and Beijing are both great.
A|你喜欢吃什么，喝什么？|Nǐ xǐhuan chī shénme, hē shénme?|What do you like to eat and drink?
B|我喜欢吃酸菜鱼和越南冰奶咖啡。你呢？|Wǒ xǐhuan chī suāncài yú hé Yuènán bīng nǎi kāfēi. Nǐ ne?|I like pickled cabbage fish and Vietnamese iced milk coffee. How about you?
A|我喜欢吃包子，最喜欢喝奶茶。|Wǒ xǐhuan chī bāozi, zuì xǐhuan hē nǎichá.|I like steamed buns, and I like milk tea the most.
# 歌曲和电影
A|你喜欢中文歌吗？|Nǐ xǐhuan Zhōngwén gē ma?|Do you like Chinese songs?
B|我很喜欢中文歌，最喜欢周杰伦。你呢？|Wǒ hěn xǐhuan Zhōngwén gē, zuì xǐhuan Zhōu Jiélún. Nǐ ne?|I really like Chinese songs, and I like Jay Chou the most. How about you?
A|我不听中文歌，但我喜欢电影《叶问》。|Wǒ bù tīng Zhōngwén gē, dàn wǒ xǐhuan diànyǐng «Yè Wèn».|I don't listen to Chinese songs, but I like the film Ip Man.
B|我也喜欢这个电影，很好看！|Wǒ yě xǐhuan zhège diànyǐng, hěn hǎokàn!|I like that film too. It's really good!
# 家人和宠物
B|你看，这是我们家的照片。|Nǐ kàn, zhè shì wǒmen jiā de zhàopiàn.|Look, this is a photo of our family.
A|这张照片真漂亮！你们家有几口人？|Zhè zhāng zhàopiàn zhēn piàoliang! Nǐmen jiā yǒu jǐ kǒu rén?|What a beautiful photo! How many people are in your family?
B|我们家有五口人：爸爸、妈妈、一个哥哥、一个妹妹和我。你呢？|Wǒmen jiā yǒu wǔ kǒu rén: bàba, māma, yí ge gēge, yí ge mèimei hé wǒ. Nǐ ne?|There are five of us: Dad, Mum, an older brother, a younger sister and me. How about you?
A|我们家有四口人：爸爸、妈妈、一个姐姐和我。你爸爸妈妈做什么工作？|Wǒmen jiā yǒu sì kǒu rén: bàba, māma, yí ge jiějie hé wǒ. Nǐ bàba māma zuò shénme gōngzuò?|There are four of us: Dad, Mum, an older sister and me. What do your parents do?
B|我爸爸是医生，我妈妈是律师。你爸爸妈妈呢？|Wǒ bàba shì yīshēng, wǒ māma shì lǜshī. Nǐ bàba māma ne?|My dad is a doctor and my mum is a lawyer. What about your parents?
A|我爸爸是老师，他教英语。我妈妈不工作，她在家。|Wǒ bàba shì lǎoshī, tā jiāo Yīngyǔ. Wǒ māma bù gōngzuò, tā zài jiā.|My dad is a teacher and teaches English. My mum doesn't work; she's at home.
B|这是我哥哥，这是我妹妹。我哥哥今年二十八岁，他也是律师。|Zhè shì wǒ gēge, zhè shì wǒ mèimei. Wǒ gēge jīnnián èrshíbā suì, tā yě shì lǜshī.|This is my older brother, and this is my younger sister. My brother is twenty-eight this year and he's a lawyer too.
A|你妹妹今年几岁？她是学生吗？|Nǐ mèimei jīnnián jǐ suì? Tā shì xuésheng ma?|How old is your sister this year? Is she a student?
B|她今年十五岁，是学生。她学钢琴，很喜欢唱歌。|Tā jīnnián shíwǔ suì, shì xuésheng. Tā xué gāngqín, hěn xǐhuan chàng gē.|She's fifteen and a student. She learns piano and loves singing.
A|她唱中文歌吗？|Tā chàng Zhōngwén gē ma?|Does she sing Chinese songs?
B|她唱中文歌，也跳舞。你姐姐喜欢唱歌跳舞吗？|Tā chàng Zhōngwén gē, yě tiàowǔ. Nǐ jiějie xǐhuan chàng gē tiàowǔ ma?|She sings Chinese songs and dances too. Does your sister like singing and dancing?
A|我姐姐不喜欢跳舞，她喜欢看电影。|Wǒ jiějie bù xǐhuan tiàowǔ, tā xǐhuan kàn diànyǐng.|My sister doesn't like dancing; she likes watching films.
B|她今年多大？|Tā jīnnián duō dà?|How old is she this year?
A|她今年三十岁，属鼠，一九九六年出生。|Tā jīnnián sānshí suì, shǔ shǔ, yī jiǔ jiǔ liù nián chūshēng.|She's thirty, born in the year of the Rat, in 1996.
B|我妹妹属兔。对了，你们家有宠物吗？|Wǒ mèimei shǔ tù. Duìle, nǐmen jiā yǒu chǒngwù ma?|My sister was born in the Year of the Rabbit. By the way, do you have any pets?
A|我们家有一只狗，它叫贝贝。|Wǒmen jiā yǒu yì zhī gǒu, tā jiào Bèibèi.|We have a dog. Its name is Beibei.
B|贝贝今年几岁？它喜欢吃什么？|Bèibèi jīnnián jǐ suì? Tā xǐhuan chī shénme?|How old is Beibei? What does it like to eat?
A|它今年五岁，喜欢吃米饭和包子。你们有宠物吗？|Tā jīnnián wǔ suì, xǐhuan chī mǐfàn hé bāozi. Nǐmen yǒu chǒngwù ma?|It's five years old and likes rice and steamed buns. Do you have any pets?
B|我们家有一只小猫，它三个月大，叫咪咪。它很可爱！|Wǒmen jiā yǒu yì zhī xiǎomāo, tā sān ge yuè dà, jiào Mīmī. Tā hěn kě'ài!|We have a kitten. It's three months old, and its name is Mimi. It's very cute!
# RMIT 的朋友
A|你有中国朋友吗？|Nǐ yǒu Zhōngguó péngyou ma?|Do you have any Chinese friends?
B|我有两个中国朋友，他们也在 RMIT 学习。|Wǒ yǒu liǎng ge Zhōngguó péngyou, tāmen yě zài RMIT xuéxí.|I have two Chinese friends, and they study at RMIT too.
A|他们学习什么专业？|Tāmen xuéxí shénme zhuānyè?|What are they studying?
B|他们都是英语专业。星期六他们教我说汉语，写汉字。|Tāmen dōu shì Yīngyǔ zhuānyè. Xīngqīliù tāmen jiāo wǒ shuō Hànyǔ, xiě Hànzì.|They're both English majors. On Saturdays they teach me to speak Chinese and write characters.
# 生日邀请和告别
A|明天是五月二十一号，他们有时间吗？|Míngtiān shì wǔ yuè èrshíyī hào, tāmen yǒu shíjiān ma?|Tomorrow is 21 May. Are they free?
B|什么事儿？|Shénme shìr?|What's the occasion?
A|明天是我姐姐的生日。晚上我们家有一个生日聚会，你们能来参加吗？|Míngtiān shì wǒ jiějie de shēngrì. Wǎnshang wǒmen jiā yǒu yí ge shēngrì jùhuì, nǐmen néng lái cānjiā ma?|Tomorrow is my older sister's birthday. We're having a birthday party at our house in the evening. Can you all come?
B|太好了！我们一定去。你送她什么生日礼物？|Tài hǎo le! Wǒmen yídìng qù. Nǐ sòng tā shénme shēngrì lǐwù?|Great! We'll definitely come. What birthday present are you giving her?
A|我会送她巧克力和一个蛋糕。我们还会做寿面。|Wǒ huì sòng tā qiǎokèlì hé yí ge dàngāo. Wǒmen hái huì zuò shòumiàn.|I'll give her chocolates and a cake. We'll also make longevity noodles.
B|祝你姐姐生日快乐，也祝你合家欢乐。|Zhù nǐ jiějie shēngrì kuàilè, yě zhù nǐ héjiā huānlè.|Happy birthday to your sister, and I wish happiness to your whole family too.
A|谢谢你！明天见。|Xièxie nǐ! Míngtiān jiàn.|Thank you! See you tomorrow.
B|明天见。|Míngtiān jiàn.|See you tomorrow.`;

      const V = "aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ";
      // 1) "èr"-type syllables (二) stay together; 2) normal syllables; 3) lone "r" is erhua (儿)
      const SYL = new RegExp(
        `[ēéěè]r(?![${V}])|(?:zh|ch|sh|[bpmfdtnlgkhjqxzcsrwy])?[${V}]+(?:ng(?![${V}])|n(?![${V}]))?|r`,
        "gi"
      );
      const CJK = /[\u4e00-\u9fff]/;

      function render(zh, py) {
        // apostrophes become spaces so syllables like qī'èr and kě'ài stay separate
        const syl = py.replace(/RMIT/g, "").replace(/['’]/g, " ").match(SYL) || [];
        const chars = [...zh];
        if (syl.length !== chars.filter(c => CJK.test(c)).length) {
          return `<span class="fb">${py}</span>${zh}`;
        }
        let i = 0;
        return chars.map(c => CJK.test(c) ? `<ruby>${c}<rt>${syl[i++]}</rt></ruby>` : c).join("");
      }

      const out = document.getElementById("out");
      let html = "";
      for (const row of DATA.split("\n")) {
        if (row.startsWith("# ")) { html += `<h2>${row.slice(2)}</h2>`; continue; }
        const [s, zh, py, en] = row.split("|");
        html += `<div class="line ${s}"><div class="bubble"><span class="who">${WHO[s]}</span><div class="zh">${render(zh, py)}</div><div class="en">${en || ""}</div></div></div>`;
      }
      out.innerHTML = html;

      const pyBtn = document.getElementById("py");
      pyBtn.onclick = () => {
        const on = pyBtn.getAttribute("aria-pressed") !== "true";
        pyBtn.setAttribute("aria-pressed", on);
        out.classList.toggle("nopy", !on);
      };
      const enBtn = document.getElementById("en");
      enBtn.onclick = () => {
        const on = enBtn.getAttribute("aria-pressed") !== "true";
        enBtn.setAttribute("aria-pressed", on);
        out.classList.toggle("showen", on);
      };
      const enOnlyBtn = document.getElementById("enonly");
      enOnlyBtn.onclick = () => {
        const on = enOnlyBtn.getAttribute("aria-pressed") !== "true";
        enOnlyBtn.setAttribute("aria-pressed", on);
        out.classList.toggle("onlyen", on);
      };
      document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
        const was = b.getAttribute("aria-pressed") === "true";
        document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", "false"));
        if (was) { delete document.body.dataset.focus; }
        else { b.setAttribute("aria-pressed", "true"); document.body.dataset.focus = b.dataset.f; }
      });
    </script>
  </body>

</html>
